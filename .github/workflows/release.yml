name: Create Release

on:
  push:
    branches:
      - master
    paths:
      - "vaft/**"
      - "video-swap-new/**"

jobs:
  create-release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Git user
      run: git config --global user.email "JohnDoe@example.com" && git config --global user.name "John Doe"

    - name: Set release notes
      id: set-notes
      run: |
        {
          echo "release_notes<<EOF"
          git log -1 --pretty=format:%s
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create-release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Release v${{ github.run_number }}"
        body: ${{ steps.set-notes.outputs.release_notes }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
